services:
  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - RUNTIME_NODE_URL=http://runtime-server:9090
  runtime-server:
    build:
      context: ..
      dockerfile: integrations/docker/runtime-server.Dockerfile
    ports:
      - "9090:9090"
