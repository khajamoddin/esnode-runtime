[package]
name = "runtime-server"
version = "0.1.0"
edition = "2021"

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
axum = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
hex = "0.4"
http = "1"
lru = "0.12"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
futures-core = "0.3"
prost = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
tokio-stream = "0.1"
tonic = "0.11"
runtime-core = { path = "../runtime-core" }
walkdir = "2"

[build-dependencies]
tonic-build = "0.11"

[features]
proto-gen = []

[dev-dependencies]
http-body-util = "0.1"
hyper = "1"
tower = "0.4"
